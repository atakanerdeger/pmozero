<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PMOZero – Legal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f7f7f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: linear-gradient(135deg, #2D1F8F, #6C47FF);
      border-radius: 24px;
      padding: 48px 40px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(45,31,143,0.25);
    }
    h1 { color: #fff; font-size: 2rem; font-weight: 800; margin-bottom: 8px; }
    p { color: rgba(255,255,255,0.7); font-size: 0.95rem; margin-bottom: 32px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    a {
      display: block;
      background: rgba(255,255,255,0.15);
      border: 1.5px solid rgba(255,255,255,0.3);
      color: #fff;
      text-decoration: none;
      border-radius: 14px;
      padding: 14px 20px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background 0.2s;
    }
    a:hover { background: rgba(255,255,255,0.25); }
  </style>
</head>
<body>
  <div class="card">
    <h1>PMOZero</h1>
    <p>Legal documents for the PMOZero app</p>
    <div class="links">
      <a href="privacy-policy.html">🔒 Privacy Policy</a>
      <a href="terms-of-service.html">📄 Terms of Use</a>
    </div>
  </div>
</body>
</html>
